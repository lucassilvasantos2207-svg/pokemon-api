<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex API</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Pokédex</h1>
    <p>Dados servidos pela minha API em Java/Spring Boot</p>
  </header>

  <section class="filtros">
    <input type="text" id="busca" placeholder="Buscar por nome (ex: pikachu)">
    <button id="btnBuscar">Buscar</button>
    <select id="tipo">
      <option value="">Todos os tipos</option>
    </select>
    <button id="btnLimpar" class="secundario">Limpar</button>
  </section>

  <p id="mensagem"></p>

  <main id="lista" class="grid"></main>

  <nav class="paginacao" id="paginacao">
    <button id="anterior">Anterior</button>
    <span id="pagina"></span>
    <button id="proxima">Próxima</button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
